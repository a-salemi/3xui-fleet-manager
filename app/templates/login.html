<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>3X-UI Manager · Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  @import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-core: #090a0f;
    --bg-card: rgba(18, 20, 31, 0.75);
    --border-color: rgba(255, 255, 255, 0.08);
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --danger: #f43f5e;
  }

  body {
    font-family: 'Plus Jakarta Sans', 'Vazirmatn', -apple-system, sans-serif;
    background-color: var(--bg-core);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background-image: 
      radial-gradient(ellipse 70% 50% at 50% -20%, rgba(139, 92, 246, 0.2), transparent),
      radial-gradient(ellipse 60% 40% at 85% 85%, rgba(6, 182, 212, 0.12), transparent);
    background-attachment: fixed;
  }

  .login-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 24px;
    padding: 44px 38px;
    width: 100%;
    max-width: 420px;
    backdrop-filter: blur(20px);
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(139,92,246,0.15);
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .brand-group {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .logo-orb {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--accent-gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
  }

  .brand-title {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }

  .brand-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #06b6d4;
  }

  h1 {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 26px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-secondary);
    margin-bottom: 7px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s;
  }

  input:focus {
    border-color: rgba(139, 92, 246, 0.6);
    box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15);
  }

  .btn {
    width: 100%;
    padding: 13px;
    background: var(--accent-gradient);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 14px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
  }

  .btn:hover {
    opacity: 0.92;
    transform: translateY(-1px);
    box-shadow: 0 6px 22px rgba(99, 102, 241, 0.45);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .error-box {
    background: rgba(244, 63, 94, 0.12);
    border: 1px solid rgba(244, 63, 94, 0.3);
    border-radius: 10px;
    padding: 11px 14px;
    margin-bottom: 20px;
    color: var(--danger);
    font-size: 13px;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="brand-group">
    <div class="logo-orb">⚡</div>
    <div>
      <div class="brand-title">3X-UI Manager</div>
      <div class="brand-badge">PRO AUTOMATION</div>
    </div>
  </div>

  <h1>Welcome Back</h1>
  <p class="subtitle">Sign in to control your inbound schedules</p>

  {% if error %}
  <div class="error-box">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" autocomplete="username" autofocus required/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password" required/>
    </div>
    <button class="btn" type="submit">Sign In to Dashboard →</button>
  </form>
</div>
</body>
</html>
