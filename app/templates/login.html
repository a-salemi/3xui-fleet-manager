<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3X-UI Manager · Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --accent:   #6c63ff;
    --accent2:  #a855f7;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --danger:   #f43f5e;
    --success:  #10b981;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* animated gradient bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 20%, rgba(108,99,255,.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 80%, rgba(168,85,247,.10) 0%, transparent 60%);
    z-index: 0;
    animation: pulse 8s ease-in-out infinite alternate;
  }
  @keyframes pulse { from { opacity:.6 } to { opacity:1 } }

  .login-card {
    position: relative;
    z-index: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 48px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 25px 60px rgba(0,0,0,.5), 0 0 0 1px rgba(108,99,255,.08);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .logo-text { font-size: 18px; font-weight: 700; letter-spacing: -.3px; }
  .logo-sub  { font-size: 11px; color: var(--muted); margin-top: 1px; }

  h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 32px; }

  .field { margin-bottom: 18px; }
  label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 7px; letter-spacing: .5px; text-transform: uppercase; }
  input {
    width: 100%; padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 14px;
    font-family: 'Inter', sans-serif;
    transition: border-color .2s, box-shadow .2s;
    outline: none;
  }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,.15);
  }

  .btn {
    width: 100%; padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px;
    color: #fff; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: opacity .2s, transform .1s;
    font-family: 'Inter', sans-serif;
    margin-top: 6px;
  }
  .btn:hover { opacity: .88; }
  .btn:active { transform: scale(.98); }

  .error-box {
    background: rgba(244,63,94,.08); border: 1px solid rgba(244,63,94,.3);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 20px;
    color: var(--danger); font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="logo-text">3X-UI Manager</div>
      <div class="logo-sub">Inbound Scheduler</div>
    </div>
  </div>

  <h1>Welcome back</h1>
  <p class="subtitle">Sign in to manage your inbound schedules</p>

  {% if error %}
  <div class="error-box">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST" action="/login">
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="admin" autocomplete="username" autofocus/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <button class="btn" type="submit">Sign In →</button>
  </form>
</div>
</body>
</html>
